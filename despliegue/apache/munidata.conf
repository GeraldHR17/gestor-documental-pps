# ============================================================
# Muni Data — configuracion de Apache
# ============================================================
# Sistema Integral de Gestion Documental, Municipalidad de Palmares.
#
# Este archivo NO se aplica solo: hay que incluirlo desde la
# configuracion de Apache. Dos opciones, segun como este organizado el
# servidor:
#
#   a) Dentro del <VirtualHost *:443> que ya sirve HTTPS:
#        Include conf/extra/munidata.conf
#
#   b) Al final de httpd.conf, si no hay VirtualHost separado:
#        Include conf/extra/munidata.conf
#
# La opcion (a) es la correcta en esta VM, porque HTTPS lo resuelve
# Apache y el resto de los sistemas ya viven en ese VirtualHost.
#
# ------------------------------------------------------------
# Modulos requeridos
# ------------------------------------------------------------
# Deben estar activos (sin el "#" delante) en httpd.conf:
#
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule headers_module modules/mod_headers.so
#   LoadModule rewrite_module modules/mod_rewrite.so
#
# Comprobar cuales estan cargados:
#   httpd -M
# o, si httpd no esta en el PATH:
#   "C:\Apache24\bin\httpd.exe" -M
#
# Deben aparecer: proxy_module, proxy_http_module, headers_module y
# rewrite_module.
#
# Validar la sintaxis ANTES de reiniciar (si esto falla, Apache no
# arranca y se cae WordPress junto con todo lo demas):
#   httpd -t
#
# ------------------------------------------------------------
# Valores a ajustar
# ------------------------------------------------------------
# Antes de incluir este archivo hay que revisar dos cosas:
#
#   1. La ruta de la carpeta del frontend en el bloque <Directory>. En
#      esta VM, Apache esta instalado en C:\Apache24, asi que la ruta es
#      C:/Apache24/htdocs/munipalmares/wp-munidata y ya viene puesta.
#      Confirmela contra el DocumentRoot de httpd.conf.
#   2. El puerto del backend (3100 por defecto) si se cambio al
#      desplegar.
#
# Ambos aparecen marcados con "AJUSTAR" mas abajo.

# ------------------------------------------------------------
# Proxy inverso de la API
# ------------------------------------------------------------
# Solo se proxea /munipalmares/wp-munidata/api. El resto de esa ruta son
# archivos estaticos del frontend que sirve Apache directamente.
#
# El backend escucha unicamente en 127.0.0.1 (HOST_ESCUCHA), asi que este
# proxy es el unico camino hacia la API. No hace falta abrir el puerto en
# el firewall.
#
# Importante: el backend NO usa prefijo global de rutas. Sus rutas son
# /auth/..., /documentos/..., /salud. ProxyPass recorta la parte publica
# antes de reenviar, de modo que
#   /munipalmares/wp-munidata/api/auth/login  ->  127.0.0.1:3100/auth/login
# Por eso el destino del ProxyPass no lleva ninguna subruta.

<IfModule mod_proxy.c>
  # No reenviar peticiones del proxy hacia si mismo.
  ProxyRequests Off
  ProxyPreserveHost On

  # retry=0: si el servicio MuniData-API esta reiniciandose, Apache
  # vuelve a intentar en la siguiente peticion en vez de marcar el
  # backend como caido durante 60 segundos (su valor por omision), que es
  # lo que convierte un reinicio de 3 segundos en un minuto de 503.
  #
  # timeout=600: la carga de un PDF de hasta 40 MB por una conexion lenta
  # puede tardar bastante mas que los 60 segundos por omision, y el
  # backend ademas calcula el SHA-256 y cuenta las paginas antes de
  # responder. Con un timeout corto, Apache cortaria la conexion y
  # devolveria 502 aunque el documento se hubiera guardado bien.
  #
  # AJUSTAR: el puerto 3100 debe coincidir con PUERTO de .env.produccion.
  ProxyPass        /munipalmares/wp-munidata/api  http://127.0.0.1:3100  retry=0 timeout=600 connectiontimeout=10
  ProxyPassReverse /munipalmares/wp-munidata/api  http://127.0.0.1:3100

  # ----------------------------------------------------------
  # Reescritura del Path de la cookie del refresh token
  # ----------------------------------------------------------
  # El backend emite la cookie httpOnly 'refreshToken' con Path=/auth
  # (ver establecerCookieRefresh en autenticacion.controller.ts). Ese
  # Path es correcto visto desde el backend, pero el navegador ve la
  # aplicacion bajo /munipalmares/wp-munidata/, de modo que una cookie
  # con Path=/auth no se enviaria nunca: el navegador solo la adjunta a
  # URL que empiecen por /auth, y ninguna peticion del frontend lo hace.
  #
  # El sintoma seria exactamente este: el login funciona, pero al recargar
  # la pagina la sesion se pierde porque POST .../api/auth/refresh llega
  # sin cookie y responde 401.
  #
  # Se corrige aqui, en el borde, y no en el codigo, para que el backend
  # siga sirviendo igual en desarrollo (donde se accede directo al puerto
  # y Path=/auth si es el correcto).
  ProxyPassReverseCookiePath /auth /munipalmares/wp-munidata/api/auth

  # Limite de tamano del cuerpo para la API: 40 MiB, el mismo que impone
  # el CHECK de versiones_documentos (tamano_bytes <= 41943040). Se
  # declara explicito porque el valor por omision de Apache es 0 (sin
  # limite) y conviene que el rechazo ocurra en el borde, sin gastar
  # tiempo del backend en una subida que la base va a rechazar.
  <Location /munipalmares/wp-munidata/api>
    LimitRequestBody 41943040

    <IfModule mod_headers.c>
      # El backend corre con CONFIAR_EN_PROXY=true y 'trust proxy' = 1.
      # Sin esta cabecera veria todas las peticiones como http, porque la
      # conexion entre Apache y Node va en claro por loopback, y
      # req.protocol / req.secure quedarian mal.
      #
      # Se usa "set" y no "setifempty" a proposito: asi se descarta
      # cualquier X-Forwarded-Proto que mande el cliente, que de otro modo
      # podria hacerle creer al backend que la conexion es segura.
      RequestHeader set X-Forwarded-Proto "https"
    </IfModule>
  </Location>
</IfModule>

# ------------------------------------------------------------
# Carpeta del frontend
# ------------------------------------------------------------
# La ruta de abajo corresponde a esta VM, donde Apache esta instalado en
# C:\Apache24:
#
#   C:/Apache24/htdocs/munipalmares/wp-munidata
#
# Confirmela contra el DocumentRoot de C:\Apache24\conf\httpd.conf antes
# de incluir este archivo. Las rutas en la configuracion de Apache se
# escriben con "/" incluso en Windows.
#
# NOTA: si el servidor ya define un <Directory> para htdocs (lo habitual
# cuando hay WordPress), NO lo reemplace. Basta con comprobar que ese
# bloque tenga AllowOverride All, o agregar solo este bloque mas
# especifico, que gana por ser mas profundo en el arbol.
#
# AllowOverride All es imprescindible: sin el, Apache ignora el .htaccess
# que viene en el build y las rutas profundas del SPA
# (/munipalmares/wp-munidata/documentos/7) devuelven 404 al recargar.

<Directory "C:/Apache24/htdocs/munipalmares/wp-munidata">
  AllowOverride All
  Require all granted
  Options -Indexes

  # Si el .htaccess del build no se aplicara por alguna razon, el SPA
  # seguiria sin resolver rutas profundas; conviene verificarlo con la
  # prueba de humo de despliegue/verificar-despliegue.ps1, que pide una
  # ruta profunda expresamente.
</Directory>

# ------------------------------------------------------------
# Notas
# ------------------------------------------------------------
# - ProxyPass NO es valido dentro de un .htaccess: solo funciona en la
#   configuracion del servidor. Por eso el proxy vive en este archivo y
#   el enrutamiento del SPA en frontend/public/.htaccess.
#
# - El orden importa: las directivas ProxyPass deben declararse antes de
#   cualquier Alias o DocumentRoot que pudiera capturar la misma ruta.
#
# - Para revertir: comente la linea "Include" que agrego, ejecute
#   "httpd -t" y reinicie Apache. El frontend dejaria de responder y la
#   API quedaria inaccesible, pero WordPress y los demas sistemas vuelven
#   exactamente al estado anterior.
